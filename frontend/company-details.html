<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View a Saple company profile, benefits, and salary summaries.">
  <title>Company Details | Saple</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/company-details.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="brand" href="index.html" aria-label="Saple home">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>Saple</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a class="active" href="companies.html" aria-current="page">Companies</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-main">
    <div class="container">
      <a class="back-link" href="companies.html">← Back to companies</a>
      <p id="details-status" class="status-message" role="status" aria-live="polite">Loading company details…</p>

      <div id="company-content" hidden>
        <section id="company-profile" class="company-profile" aria-labelledby="company-name"></section>

        <section class="detail-section" aria-labelledby="benefits-heading">
          <div class="section-heading">
            <p class="eyebrow">Workplace support</p>
            <h2 id="benefits-heading">Benefits</h2>
          </div>
          <div id="benefits-list" class="benefit-grid"></div>
        </section>

        <section class="detail-section" aria-labelledby="verified-salary-heading">
          <div class="section-heading">
            <p class="eyebrow">Approved and verified contributions</p>
            <h2 id="verified-salary-heading">Verified salary summary</h2>
          </div>
          <div id="verified-salary-list" class="salary-list"></div>
        </section>

        <section class="detail-section" aria-labelledby="community-salary-heading">
          <div class="section-heading">
            <p class="eyebrow">All approved contributions</p>
            <h2 id="community-salary-heading">Community salary summary</h2>
          </div>
          <div id="community-salary-list" class="salary-list"></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Saple — a BUET CSE database project.</p>
    </div>
  </footer>

  <script type="module" src="js/company-details.js"></script>
</body>
</html>
