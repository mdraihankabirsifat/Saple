name: CI

# Runs without any secret. Live database, SMTP and AI checks need real
# credentials and are run by the owner locally, never here.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Backend and frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit and HTTP tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Whitespace errors in the latest change
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
          fi

      - name: No environment files are tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.local)?$' || true)
          if [ -n "$tracked" ]; then
            echo "Tracked environment files: $tracked"
            exit 1
          fi

      - name: No committed secrets
        run: |
          # Real-looking keys and connection strings. Documentation placeholders
          # (your_*, replace_with_*, ${VARIABLE}) are excluded.
          matches=$(git grep -nIE \
            -e 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            -e 'sk-[A-Za-z0-9]{20,}' \
            -e 'gsk_[A-Za-z0-9]{20,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'postgres(ql)?://[^ :@]+:[^ @]+@' \
            -- . ':!backend/package-lock.json' \
            | grep -vE 'your_|replace_with|\$\{|<[a-z_-]+>' || true)
          if [ -n "$matches" ]; then
            echo "Possible secrets (values hidden):"
            echo "$matches" | cut -d: -f1,2 | sort -u
            exit 1
          fi

      - name: No executable-string or HTML-injection sinks in the frontend
        run: |
          if git grep -nE '\.innerHTML\s*=|insertAdjacentHTML|document\.write|[^A-Za-z]eval\(|new Function\(' -- frontend/; then
            exit 1
          fi

  ml:
    name: ML prototype tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install
        run: pip install pandas scikit-learn joblib

      - name: Unit tests
        run: python -m unittest discover -s tests -v
