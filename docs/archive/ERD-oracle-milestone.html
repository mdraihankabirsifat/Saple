<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Saple Chen-style ERD</title>
  <style>
    @page { size: 28in 18in landscape; margin: 0; }
    html, body { width: 100%; height: 100%; margin: 0; background: #f7fbf8; }
    svg { width: 100%; height: 100%; display: block; font-family: "Segoe UI", Arial, sans-serif; }
    .relationship { fill: none; stroke: #789488; stroke-width: 2.2; }
    .cardinality { fill: #365f4d; font-size: 14px; font-weight: 800; }
    .relation-label { fill: #49685b; font-size: 13px; font-weight: 700; }
    .attribute-line { stroke: #a9bdb3; stroke-width: 1.5; }
    .attribute { fill: #ffffff; stroke: #6fa58d; stroke-width: 1.5; }
    .attribute.key { fill: #fff8dc; stroke: #af8c2f; stroke-width: 2; }
    .attribute.new { fill: #e7f7ee; stroke: #23865c; stroke-width: 2.4; }
    .attribute-text { fill: #243f34; font-size: 12.5px; text-anchor: middle; dominant-baseline: middle; }
    .entity { fill: #176b4a; stroke: #0d4e35; stroke-width: 2.5; rx: 12; }
    .entity.reference { fill: #315f77; stroke: #1e4458; }
    .entity.workflow { fill: #765f2d; stroke: #554118; }
    .entity-text { fill: #ffffff; font-size: 17px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    .title { fill: #123d2c; font-size: 40px; font-weight: 850; text-anchor: middle; }
    .subtitle { fill: #4d6b5e; font-size: 18px; text-anchor: middle; }
    .legend { fill: #ffffff; stroke: #b9cec4; stroke-width: 2; rx: 16; }
    .legend-heading { fill: #123d2c; font-size: 18px; font-weight: 800; }
    .legend-text { fill: #3f5b4f; font-size: 14px; }
  </style>
</head>
<body>
  <svg id="erd" viewBox="0 0 2700 1750" role="img" aria-labelledby="erd-title erd-description">
    <title id="erd-title">Saple relational database Chen-style entity relationship diagram</title>
    <desc id="erd-description">Fourteen Oracle relations shown as entities with flower-like attribute petals and their foreign-key relationships.</desc>
    <text x="1350" y="58" class="title">Saple Oracle 19c Entity–Relationship Diagram</text>
    <text x="1350" y="92" class="subtitle">Implemented schema after migrations 06 and 07 · ADMIN is USERS.ACCOUNT_ROLE, not a separate entity</text>
    <g id="relationships"></g>
    <g id="entities"></g>
    <g transform="translate(2180 1360)">
      <rect width="470" height="275" class="legend" />
      <text x="28" y="38" class="legend-heading">Notation and privacy boundary</text>
      <ellipse cx="80" cy="78" rx="58" ry="22" class="attribute key" />
      <text x="80" y="78" class="attribute-text">PK / UK</text>
      <text x="160" y="83" class="legend-text">key attribute</text>
      <ellipse cx="80" cy="123" rx="58" ry="22" class="attribute new" />
      <text x="80" y="123" class="attribute-text">new in 06/07</text>
      <text x="160" y="128" class="legend-text">additive migration field/entity</text>
      <text x="28" y="168" class="legend-text">Ellipses are Chen-style attribute petals.</text>
      <text x="28" y="195" class="legend-text">Evidence, password hashes, token hashes, and</text>
      <text x="28" y="218" class="legend-text">internal identities remain outside public APIs.</text>
      <text x="28" y="251" class="legend-text">Synthetic seed 08 adds rows, not schema objects.</text>
    </g>
  </svg>
  <script>
    const entities = [
      { id: 'reset', name: 'PASSWORD_RESET_TOKENS', col: 0, row: 0, type: 'workflow', attrs: [
        ['RESET_TOKEN_ID (PK)', 'key'], ['USER_ID (FK)', ''], ['TOKEN_HASH (UK, SHA-256)', 'new'],
        ['EXPIRES_AT', ''], ['USED_AT', ''], ['REVOKED_AT', ''], ['CREATED_AT', '']
      ] },
      { id: 'users', name: 'USERS', col: 1, row: 0, attrs: [
        ['USER_ID (PK)', 'key'], ['EMAIL (UK)', 'key'], ['FULL_NAME', ''], ['PASSWORD_HASH', ''],
        ['USER_TYPE', ''], ['ACCOUNT_ROLE {USER, ADMIN}', 'new'], ['ACCOUNT_STATUS', ''], ['CREATED_AT', '']
      ] },
      { id: 'employees', name: 'EMPLOYEES', col: 2, row: 0, attrs: [
        ['EMPLOYEE_ID (PK)', 'key'], ['USER_ID (FK, UK)', 'key'], ['EMPLOYMENT_STATUS', ''], ['CREATED_AT', '']
      ] },
      { id: 'verifications', name: 'EMPLOYMENT_VERIFICATIONS', col: 3, row: 0, type: 'workflow', attrs: [
        ['VERIFICATION_ID (PK)', 'key'], ['EMPLOYEE_ID (FK)', ''], ['COMPANY_ID (FK)', ''],
        ['ROLE_ID (FK, legacy nullable)', 'new'], ['VERIFICATION_METHOD', ''], ['VERIFICATION_STATUS', ''],
        ['COMPANY_EMAIL / PROOF_REF', ''], ['REQUESTED / REVIEWED / EXPIRES', ''], ['REVIEWED_BY (FK USERS)', '']
      ] },
      { id: 'roles', name: 'JOB_ROLES', col: 4, row: 0, type: 'reference', attrs: [
        ['ROLE_ID (PK)', 'key'], ['ROLE_NAME (UK)', 'key'], ['ROLE_CATEGORY', ''], ['DESCRIPTION', '']
      ] },
      { id: 'reports', name: 'REPORTS', col: 0, row: 1, type: 'workflow', attrs: [
        ['REPORT_ID (PK)', 'key'], ['REPORTER_USER_ID (FK)', ''], ['SUBMISSION_ID (FK)', ''],
        ['REASON_CATEGORY', ''], ['REPORT_STATUS', ''], ['RESOLUTION_NOTE', ''], ['RESOLVED_BY (FK USERS)', '']
      ] },
      { id: 'submissions', name: 'SUBMISSIONS', col: 1, row: 1, type: 'workflow', attrs: [
        ['SUBMISSION_ID (PK)', 'key'], ['USER_ID (FK)', ''], ['COMPANY_ID (FK)', ''],
        ['SUBMISSION_TYPE', ''], ['IS_ANONYMOUS', ''], ['SUBMISSION_STATUS', ''],
        ['VERIFICATION_STATUS', ''], ['SUBMITTED / APPROVED_AT', '']
      ] },
      { id: 'salaries', name: 'SALARY_SUBMISSIONS', col: 2, row: 1, attrs: [
        ['SUBMISSION_ID (PK, FK)', 'key'], ['ROLE_ID (FK)', ''], ['BASE_SALARY', ''],
        ['ADDITIONAL_COMPENSATION', ''], ['CURRENCY / PAY_PERIOD', ''], ['YEARS_OF_EXPERIENCE', ''],
        ['EMPLOYMENT_TYPE / WORK_MODE', ''], ['SALARY_YEAR', '']
      ] },
      { id: 'reviews', name: 'COMPANY_REVIEWS', col: 3, row: 1, attrs: [
        ['SUBMISSION_ID (PK, FK)', 'key'], ['ROLE_ID (FK, historical nullable)', ''], ['REVIEW_TITLE', ''],
        ['OVERALL_RATING', ''], ['4 CATEGORY RATINGS', ''], ['PROS / CONS / ADVICE', ''],
        ['EMPLOYMENT_STATUS', ''], ['REVIEW_DATE', '']
      ] },
      { id: 'interviews', name: 'INTERVIEW_EXPERIENCES', col: 4, row: 1, attrs: [
        ['SUBMISSION_ID (PK, FK)', 'key'], ['ROLE_ID (FK)', ''], ['INTERVIEW_DATE', ''],
        ['DIFFICULTY / ROUNDS', ''], ['INTERVIEW_MODE / RESULT', ''], ['DURATION_DAYS', ''],
        ['PROCESS / QUESTIONS', '']
      ] },
      { id: 'moderation', name: 'MODERATION_ACTIONS', col: 0, row: 2, type: 'workflow', attrs: [
        ['ACTION_ID (PK)', 'key'], ['SUBMISSION_ID (FK)', ''], ['MODERATOR_USER_ID (FK)', ''],
        ['ACTION_TYPE', ''], ['PREVIOUS / NEW_STATUS', ''], ['ACTION_NOTE', ''], ['ACTION_AT', '']
      ] },
      { id: 'companies', name: 'COMPANIES', col: 1, row: 2, type: 'reference', attrs: [
        ['COMPANY_ID (PK)', 'key'], ['COMPANY_NAME (UK)', 'key'], ['INDUSTRY', ''],
        ['HEADQUARTERS_CITY / COUNTRY', ''], ['WEBSITE / SIZE', ''], ['DESCRIPTION', '']
      ] },
      { id: 'companyBenefits', name: 'COMPANY_BENEFITS', col: 2, row: 2, type: 'reference', attrs: [
        ['COMPANY_ID (PK, FK)', 'key'], ['BENEFIT_ID (PK, FK)', 'key'], ['DETAILS', ''],
        ['ELIGIBILITY', ''], ['LAST_UPDATED', '']
      ] },
      { id: 'benefits', name: 'BENEFITS', col: 3, row: 2, type: 'reference', attrs: [
        ['BENEFIT_ID (PK)', 'key'], ['BENEFIT_NAME (UK)', 'key'], ['BENEFIT_CATEGORY', ''], ['DESCRIPTION', '']
      ] }
    ];

    const relationships = [
      ['users', 'reset', 'owns', '1', 'N'], ['users', 'employees', 'has profile', '1', '0..1'],
      ['employees', 'verifications', 'requests', '1', 'N'], ['companies', 'verifications', 'scopes', '1', 'N'],
      ['roles', 'verifications', 'designates', '1', 'N'], ['users', 'verifications', 'reviews as ADMIN', '1', 'N'],
      ['users', 'submissions', 'creates', '1', 'N'], ['companies', 'submissions', 'receives', '1', 'N'],
      ['submissions', 'salaries', 'is subtype', '1', '0..1'], ['submissions', 'reviews', 'is subtype', '1', '0..1'],
      ['submissions', 'interviews', 'is subtype', '1', '0..1'], ['roles', 'salaries', 'classifies', '1', 'N'],
      ['roles', 'reviews', 'classifies', '1', 'N'], ['roles', 'interviews', 'classifies', '1', 'N'],
      ['submissions', 'reports', 'is reported by', '1', 'N'], ['submissions', 'moderation', 'audited by', '1', 'N'],
      ['users', 'reports', 'reports / resolves', '1', 'N'], ['users', 'moderation', 'moderates as ADMIN', '1', 'N'],
      ['companies', 'companyBenefits', 'offers', '1', 'N'], ['benefits', 'companyBenefits', 'included in', '1', 'N']
    ];

    const centers = new Map();
    entities.forEach((entity) => centers.set(entity.id, {
      x: 280 + entity.col * 530,
      y: 300 + entity.row * 520
    }));
    const svgNS = 'http://www.w3.org/2000/svg';
    const make = (name, attributes = {}) => {
      const node = document.createElementNS(svgNS, name);
      Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
      return node;
    };

    const relationshipLayer = document.querySelector('#relationships');
    relationships.forEach(([fromId, toId, label, fromCardinality, toCardinality], index) => {
      const from = centers.get(fromId); const to = centers.get(toId);
      const dx = to.x - from.x; const dy = to.y - from.y;
      const bend = (index % 3 - 1) * 24;
      const path = make('path', {
        d: `M ${from.x} ${from.y} Q ${(from.x + to.x) / 2 + (dy ? bend : 0)} ${(from.y + to.y) / 2 + (dx ? bend : 0)} ${to.x} ${to.y}`,
        class: 'relationship'
      });
      relationshipLayer.append(path);
      const labelText = make('text', {
        x: (from.x + to.x) / 2 + 8,
        y: (from.y + to.y) / 2 - 8 + bend,
        class: 'relation-label'
      });
      labelText.textContent = label;
      relationshipLayer.append(labelText);
      [[from, fromCardinality, 0.18], [to, toCardinality, 0.82]].forEach(([, value, ratio]) => {
        const text = make('text', {
          x: from.x + dx * ratio + 4,
          y: from.y + dy * ratio - 5,
          class: 'cardinality'
        });
        text.textContent = value; relationshipLayer.append(text);
      });
    });

    const entityLayer = document.querySelector('#entities');
    entities.forEach((entity) => {
      const center = centers.get(entity.id);
      const group = make('g', { 'aria-label': entity.name });
      entity.attrs.forEach(([attribute, kind], index) => {
        const angle = ((Math.PI * 2) / entity.attrs.length) * index - Math.PI / 2;
        const alternate = index % 2 === 0;
        const radiusX = alternate ? 222 : 188;
        const radiusY = alternate ? 190 : 152;
        const x = center.x + Math.cos(angle) * radiusX;
        const y = center.y + Math.sin(angle) * radiusY;
        group.append(make('line', { x1: center.x, y1: center.y, x2: x, y2: y, class: 'attribute-line' }));
        group.append(make('ellipse', { cx: x, cy: y, rx: 91, ry: 25, class: `attribute${kind ? ` ${kind}` : ''}` }));
        const text = make('text', { x, y, class: 'attribute-text' });
        text.textContent = attribute; group.append(text);
      });
      group.append(make('rect', {
        x: center.x - 132, y: center.y - 34, width: 264, height: 68,
        class: `entity${entity.type ? ` ${entity.type}` : ''}`
      }));
      const name = make('text', { x: center.x, y: center.y, class: 'entity-text' });
      name.textContent = entity.name; group.append(name);
      entityLayer.append(group);
    });
  </script>
</body>
</html>
